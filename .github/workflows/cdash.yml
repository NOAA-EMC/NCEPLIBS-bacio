name: cdash
on:
  push:
    branches:
    - develop
  workflow_dispatch:

jobs:
  cdash:
    runs-on: ubuntu-latest

    env:
      FC: gfortran
      CC: gcc
      CDASH_TOKEN: ${{ secrets.CDASH_TOKEN }}

    steps:

    - name: CDash
      uses: NOAA-EMC/ci-cdash@addprofiling
      with:
        profiling: true
