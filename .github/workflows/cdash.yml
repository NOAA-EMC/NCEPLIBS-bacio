name: cdash
on:
  pull_request: # make this 'push' for initial testing, then use 'merge'
    branches:
    - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  cdash:
    runs-on: ubuntu-latest

    steps:

    - name: CDash
      env:
        FC: gfortran
        CC: gcc
        CDASH_TOKEN: ${{ secrets.CDASH_TOKEN }}
      uses: NOAA-EMC/ci-cdash@develop
