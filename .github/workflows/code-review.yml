name: ai-code-review
on: [workflow_dispatch,pull_request_target]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_API_KEY: ${{ secrets.ALEX_GH_LLM_KEY }}
    permissions:
      pull-requests: write

    steps:

    - name: "Code review"
      uses: AlexanderRichert-NOAA/ci-llm-code-review@develop
      with:
        backend: gh-phi-4
        api-key: ${{ secrets.ALEX_GH_LLM_KEY }}
